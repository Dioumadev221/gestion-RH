{% extends 'frontend/base.html' %}
{% block titre %}Fiche employé{% endblock %}

{% block contenu %}
<nav aria-label="Fil d'Ariane">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'frontend:liste_employes' %}">Employés</a></li>
    <li class="breadcrumb-item active" aria-current="page" id="fil-nom">Fiche</li>
  </ol>
</nav>

<div id="fiche">
  <div class="surface surface-body"><div class="squelette mb-3" style="width: 220px"></div><div class="squelette" style="width: 140px"></div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const employeId = {{ employe_id }};

  function ligneContrat(c, estActuel) {
    let progression = '';
    if (c.date_fin) {
      const debut = new Date(`${c.date_debut}T00:00:00`), fin = new Date(`${c.date_fin}T00:00:00`);
      const pourcentage = Math.min(100, Math.max(0, ((Date.now() - debut) / (fin - debut)) * 100));
      const proche = RH.joursRestants(c.date_fin) <= RH.SEUIL_ECHEANCE;
      progression = `<div class="progression ${proche ? 'proche' : ''}" role="progressbar" aria-label="Avancement du contrat"
        aria-valuenow="${Math.round(pourcentage)}" aria-valuemin="0" aria-valuemax="100"><span style="width: ${pourcentage}%"></span></div>`;
    }
    return `<li class="${estActuel ? 'en-cours' : ''}">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="d-flex align-items-center gap-2">
          ${RH.pastilleContrat(c)}
          ${estActuel ? '<span class="small fw-medium" style="color: var(--rh-primary)">En cours</span>' : ''}
        </div>
        <span class="mono text-muted-rh">${RH.echapper(c.reference)}</span>
      </div>
      <div class="small text-muted-rh mt-1 num">
        Du ${RH.date(c.date_debut)} ${c.date_fin ? `au ${RH.date(c.date_fin)}` : '· durée indéterminée'}
      </div>
      ${RH.echeance(c)}
      ${progression}
    </li>`;
  }

  function afficherFiche(e) {
    const nomComplet = `${e.prenom} ${e.nom}`;
    document.title = `${nomComplet} · ISEP-AT`;
    document.getElementById('fil-nom').textContent = nomComplet;
    const actuel = e.contrat_actuel;

    document.getElementById('fiche').innerHTML = `
      <header class="page-header">
        <div class="identite">
          ${RH.avatar(e, 'avatar-lg')}
          <div>
            <h1>${RH.echapper(nomComplet)}</h1>
            <p class="sous-titre mb-0">${RH.echapper(e.poste)}${e.departement_nom ? ` · ${RH.echapper(e.departement_nom)}` : ''}</p>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button id="bouton-supprimer" class="btn btn-outline-danger"><i class="bi bi-trash me-1"></i>Supprimer</button>
          <a href="/employes/${e.id}/modifier/" class="btn btn-primary"><i class="bi bi-pencil me-1"></i>Modifier</a>
        </div>
      </header>

      <div class="row g-4">
        <div class="col-lg-5">
          <section class="surface">
            <div class="surface-header"><h2>Informations</h2></div>
            <div class="surface-body">
              <dl class="infos">
                <div><dt>Matricule</dt><dd class="mono">${RH.echapper(e.matricule)}</dd></div>
                <div><dt>Date d'embauche</dt><dd class="num">${RH.date(e.date_embauche)}</dd></div>
                <div><dt>Email</dt><dd><a href="mailto:${RH.echapper(e.email)}">${RH.echapper(e.email)}</a></dd></div>
                <div><dt>Téléphone</dt><dd class="num">${RH.telephone(e.telephone)}</dd></div>
                <div><dt>Département</dt><dd>${e.departement_nom ? `<a href="/?departement=${e.departement}">${RH.echapper(e.departement_nom)}</a>` : '—'}</dd></div>
                <div><dt>Poste</dt><dd>${RH.echapper(e.poste)}</dd></div>
              </dl>
            </div>
          </section>
        </div>
        <div class="col-lg-7">
          <section class="surface">
            <div class="surface-header">
              <h2>Contrats</h2>
              <span class="small text-muted-rh">${RH.pluriel(e.contrats.length, 'contrat')}</span>
            </div>
            <div class="surface-body">
              ${e.contrats.length
                ? `<ul class="chronologie">${e.contrats.map((c) => ligneContrat(c, actuel && c.id === actuel.id)).join('')}</ul>`
                : `<div class="etat-vide py-4"><i class="bi bi-file-earmark"></i>Aucun contrat enregistré.
                    <div class="mt-2"><a href="/employes/${e.id}/modifier/">Ajouter un contrat</a></div></div>`}
            </div>
          </section>
        </div>
      </div>`;

    document.getElementById('bouton-supprimer').addEventListener('click', async () => {
      if (await RH.supprimerEmploye(e.id, nomComplet)) {
        RH.messageApresRedirection(`${nomComplet} a été supprimé(e).`);
        location.href = '{% url "frontend:liste_employes" %}';
      }
    });
  }

  RH.api(`/api/employes/${employeId}/`)
    .then(afficherFiche)
    .catch((erreur) => {
      document.getElementById('fiche').innerHTML = `<div class="surface"><div class="etat-vide">
        <i class="bi bi-person-x"></i>Cet employé est introuvable.
        <div class="mt-2"><a href="{% url 'frontend:liste_employes' %}">Retour à la liste</a></div></div></div>`;
      if (erreur.status !== 404) RH.erreurServeur(erreur);
    });
</script>
{% endblock %}
