{% extends 'frontend/base.html' %}
{% block titre %}Départements{% endblock %}

{% block contenu %}
<header class="page-header">
  <div>
    <h1>Départements</h1>
    <p class="sous-titre">Organisation de l'institut et responsables</p>
  </div>
  <a href="{% url 'admin:rh_departement_changelist' %}" class="btn btn-light-rh"><i class="bi bi-gear me-1"></i>Gérer les départements</a>
</header>

<div class="grille-departements" id="departements">
  {% for _ in '123' %}
  <div class="surface carte-departement"><div class="carte-departement-photo"></div><div class="carte-departement-corps"><div class="squelette mb-3" style="width: 60%"></div><div class="squelette" style="width: 90%"></div></div></div>
  {% endfor %}
</div>
{% endblock %}

{% block scripts %}
<script>
  // L'API des employés est paginée : on demande une grande page pour les avatars des équipes
  Promise.all([RH.api('/api/departements/'), RH.api('/api/employes/?page_size=100')])
    .then(([departements, { results: employes }]) => {
      const zone = document.getElementById('departements');
      if (!departements.length) {
        zone.outerHTML = `<div class="surface"><div class="etat-vide"><i class="bi bi-diagram-3"></i>
          Aucun département. <a href="{% url 'admin:rh_departement_add' %}">Créer le premier</a></div></div>`;
        return;
      }
      zone.innerHTML = departements.map((d) => {
        const membres = employes.filter((e) => e.departement === d.id);
        const pile = membres.slice(0, 5).map((e) => RH.avatar(e)).join('');
        const photo = RH.photoDepartement(d.nom);
        return `
          <a class="surface carte-departement" href="/?departement=${d.id}">
            ${photo ? `<div class="carte-departement-photo"><img src="${photo}" alt="Département ${RH.echapper(d.nom)}" loading="lazy"></div>` : ''}
            <div class="carte-departement-corps">
            <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
              <h2>${RH.echapper(d.nom)}</h2>
              <span class="small text-muted-rh num text-nowrap">${RH.pluriel(d.nb_employes, 'employé')}</span>
            </div>
            <p class="small text-muted-rh mb-3">${RH.echapper(d.description) || 'Pas de description.'}</p>
            <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">
              <div class="small">
                <div class="text-muted-rh" style="font-size: 0.72rem">Responsable</div>
                <div class="fw-medium">${d.responsable ? RH.echapper(d.responsable) : '<span class="text-muted-rh fw-normal">Non défini</span>'}</div>
              </div>
              <div class="pile-avatars">${pile}</div>
            </div>
            </div>
          </a>`;
      }).join('');
    })
    .catch(RH.erreurServeur);
</script>
{% endblock %}
